<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="600" viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CodeSathi Main Logo">
  <defs>
    <linearGradient id="gradP" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="600" fill="#0b0b0d" rx="60" ry="60"/>

  <!-- Icon container -->
  <g transform="translate(200,300) scale(0.8)">
    <!-- Outer rounded square border -->
    <rect x="-200" y="-200" width="400" height="400" rx="70" ry="70" fill="none" stroke="url(#gradP)" stroke-width="24"/>

    <!-- Morse SOS -->
    <g fill="url(#gradP)">
      <!-- Top row (dots) -->
      <circle cx="-70" cy="-90" r="16"/>
      <circle cx="0" cy="-90" r="16"/>
      <circle cx="70" cy="-90" r="16"/>

      <!-- Middle row (dashes) -->
      <rect x="-100" y="-28" width="60" height="32" rx="16" ry="16"/>
      <rect x="-20"  y="-28" width="60" height="32" rx="16" ry="16"/>
      <rect x="60"   y="-28" width="60" height="32" rx="16" ry="16"/>

      <!-- Bottom row (dots) -->
      <circle cx="-70" cy="90" r="16"/>
      <circle cx="0"  cy="90" r="16"/>
      <circle cx="70" cy="90" r="16"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="500" y="340" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="140" font-weight="600" fill="url(#gradP)">CodeSathi</text>
</svg>
